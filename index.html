<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuba uczy się!</title>
    <meta name="description" content="Ćwiczenia dla dzieci z języka polskiego i matematyki">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="style.css">

<body>
    <header>
        <h1>Kuba uczy się!</h1>
        <p>Wybierz przedmiot</p>
    </header>

    <main>
        <a href="polski.html" class="tile">
            <span class="tile-icon" aria-hidden="true">ABC</span>
            <h2>Język Polski</h2>

        <a href="matematyka.html" class="tile">
            <span class="tile-icon" aria-hidden="true">+−</span>
            <h2>Matematyka</h2>
        </a>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => {
                console.log('Service Worker zarejestrowany');
            }).catch((err) => {
                console.log('Rejestracja SW nie powiodła się:', err);
            });
        }
    </script>
